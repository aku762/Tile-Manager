<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Manager Demo</title>
    <meta name="description" content="A simple static homepage generated from JSON tiles.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tile Manager Demo">
    <meta property="og:description" content="A simple static homepage generated from JSON tiles.">
    <meta property="og:image" content="images/og.png">
    <meta property="og:url" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tile Manager Demo">
    <meta name="twitter:description" content="A simple static homepage generated from JSON tiles.">
    <meta name="twitter:image" content="images/og.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>
</head>
<body>

<div id="vanta-bg"></div>

<div id="page">

    <div id="hero">
        <div id="logo-wrap">
            <img src="images/logo.png" alt="Tile Manager Demo"
                 onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
        </div>
        <div id="logo-text">Tile Manager Demo</div>
        <div class="hero-sub">Edit tiles. Export JSON. Build a static site.</div>
    </div>

    <div id="main">

        <!-- FILTER BAR -->
        <div id="filters">
            <button class="filter-btn active" onclick="filter('all', this)">ALL</button>
            <button class="filter-btn" onclick="filter('live', this)">LIVE</button>
            <button class="filter-btn" onclick="filter('building', this)">BUILDING</button>
            <button class="filter-btn" onclick="filter('sale', this)">FOR SALE</button>
            <button class="filter-btn" onclick="filter('roadmap', this)">ROADMAP</button>
        </div>

        <div id="sections-container"></div>

    </div><!-- /main -->

    <div id="footer">
        COPYRIGHT 2026 <a href="https://fortressflash.com">FORTRESS FLASH LABS</a>
    </div>

</div><!-- /page -->

<script>
    function filter(status, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tile').forEach(tile => {
            if (status === 'all' || tile.dataset.status === status) tile.removeAttribute('data-hidden');
            else tile.setAttribute('data-hidden', 'true');
        });
    }
</script>

<!-- tile fallback: loads tiles dynamically when index.html has not been pre-built -->
<script src="app.js"></script>

</body>
</html>
