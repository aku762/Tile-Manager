<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart-Aleck Enterprises</title>
    <meta name="description" content="Smart-Aleck Enterprises — est. 2003. All operations by Fortress Flash Labs.">
    <meta property="og:title" content="SMART-ALECK">
    <meta property="og:description" content="Smart-Aleck Enterprises — est. 2003">
    <meta property="og:image" content="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold: #d4af37;
            --gold-dim: rgba(212,175,55,0.45);
            --gold-faint: rgba(212,175,55,0.12);
            --purple: #4f0088;
            --purple-mid: #2a0048;
            --purple-dark: #0a0010;
            --text-muted: rgba(212,175,55,0.55);
            --tile-bg: rgba(13,0,24,0.96);
            --tile-border: rgba(79,0,136,0.5);
            --tile-hover: rgba(26,0,45,0.98);
            --radius: 12px;
            --mono: 'Share Tech Mono', monospace;
            --display: 'Skranji', sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--mono);
            background: var(--purple-dark);
            color: var(--gold);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* VANTA — pure background, no bars */
        #vanta-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* PAGE SCROLLS OVER VANTA */
        #page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }

        /* ── HERO ── */
        #hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem 2rem;
            text-align: center;
            min-height: 38vh;
        }

        #logo-wrap {
            width: min(520px, 88vw);
            margin-bottom: 0.75rem;
        }

        #logo-wrap img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 18px rgba(212,175,55,0.5));
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        /* Fallback text logo if image not loaded */
        #logo-text {
            font-family: var(--display);
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 700;
            color: var(--purple);
            letter-spacing: 0.08em;
            text-shadow:
                0 0 8px #000,
                0 0 20px var(--gold),
                0 0 40px var(--gold);
            animation: logoGlow 3s ease-in-out infinite alternate;
            display: none; /* show if no logo img */
        }

        @keyframes logoGlow {
            from { filter: drop-shadow(0 0 12px rgba(212,175,55,0.4)); }
            to   { filter: drop-shadow(0 0 28px rgba(212,175,55,0.75)); }
        }

        .hero-sub {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
        }

        /* player */
        #player-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #play-btn {
            background: none;
            border: 0.5px solid var(--gold-dim);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 12px 4px 8px;
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 0.15em;
            border-radius: 4px;
            transition: all 0.2s;
        }
        #play-btn:hover { border-color: var(--gold); color: var(--gold); }
        #play-btn svg { width: 12px; height: 12px; fill: currentColor; }

        .track-label {
            font-size: 0.58rem;
            color: rgba(212,175,55,0.3);
            letter-spacing: 0.1em;
        }

        /* ── MAIN CONTENT ── */
        #main {
            background: rgba(10,0,16,0.97);
            border-top: 1px solid rgba(79,0,136,0.3);
            padding: 0 0 4rem;
            backdrop-filter: blur(4px);
        }

        /* ── FILTER BAR ── */
        #filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 1.5rem 1.5rem 0.5rem;
            border-bottom: 1px solid rgba(79,0,136,0.2);
        }

        .filter-btn {
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            padding: 5px 14px;
            border-radius: 20px;
            border: 0.5px solid var(--tile-border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.18s;
            white-space: nowrap;
        }
        .filter-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
        .filter-btn.active {
            background: var(--gold-faint);
            border-color: var(--gold-dim);
            color: var(--gold);
        }

        /* ── SECTIONS ── */
        .section {
            padding: 0 1.5rem;
        }

        .section-header {
            font-size: 0.58rem;
            letter-spacing: 0.28em;
            color: rgba(150,80,220,0.95);
            padding: 1.75rem 0 0.75rem;
            font-family: var(--mono);
            border-bottom: 1px solid rgba(79,0,136,0.2);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-header::before {
            content: "//";
            color: var(--gold-dim);
        }

        /* ── TILE GRID ── */
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 10px;
        }

        /* Single column on narrow mobile */
        @media (max-width: 480px) {
            .tile-grid { grid-template-columns: 1fr; }
            #filters { padding: 1rem 1rem 0.5rem; }
            .section { padding: 0 1rem; }
            #hero { padding: 2rem 1rem 1.5rem; }
        }

        /* ── TILE ── */
        .tile {
            background: var(--tile-bg);
            border: 0.5px solid var(--tile-border);
            border-radius: var(--radius);
            padding: 1.1rem 1.1rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            position: relative;
            overflow: hidden;
        }

        .tile::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            background: linear-gradient(135deg, rgba(212,175,55,0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        .tile:hover {
            background: var(--tile-hover);
            border-color: var(--gold-dim);
            transform: translateY(-2px);
        }

        .tile-cat {
            font-size: 0.5rem;
            letter-spacing: 0.22em;
            color: var(--text-muted);
            opacity: 0.7;
        }

        .tile-favicon {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            opacity: 0.55;
            flex-shrink: 0;
            pointer-events: none;
        }

        .tile-img-wrap {
            width: 100%;
            aspect-ratio: 1200 / 630;
            border-radius: 8px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(35,0,65,0.95) 0%, rgba(12,0,22,0.95) 100%);
            flex-shrink: 0;
        }

        .tile-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .tile-name {
            font-family: var(--display);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 8px rgba(212,175,55,0.25);
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tile-desc {
            font-size: 0.62rem;
            color: rgba(180,140,210,0.95);
            line-height: 1.65;
            flex: 1;
            margin-top: 2px;
        }

        .tile-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.5rem;
            letter-spacing: 0.15em;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-live     { background: #39ff84; box-shadow: 0 0 5px #39ff84; }
        .dot-building { background: var(--gold); box-shadow: 0 0 4px rgba(212,175,55,0.6); }
        .dot-sale     { background: #ff6b35; box-shadow: 0 0 4px rgba(255,107,53,0.6); }
        .dot-roadmap  { background: rgba(79,0,136,0.8); }

        .status-live     { color: rgba(57,255,132,0.7); }
        .status-building { color: rgba(212,175,55,0.7); }
        .status-sale     { color: rgba(255,107,53,0.7); }
        .status-roadmap  { color: rgba(79,0,136,0.9); }

        .tile-domain {
            font-size: 0.5rem;
            color: rgba(212,175,55,0.25);
            letter-spacing: 0.08em;
        }

        /* hidden tiles when filtered */
        .tile[data-hidden="true"] {
            display: none;
        }

        /* ── FOOTER ── */
        #footer {
            text-align: left;
            padding: 2rem 1.5rem 1.5rem;
            font-size: 0.55rem;
            color: rgba(79,0,136,0.6);
            letter-spacing: 0.15em;
            line-height: 2.4;
            border-top: 1px solid rgba(79,0,136,0.15);
        }

        #footer a { color: rgba(212,175,55,0.25); text-decoration: none; }
        #footer a:hover { color: rgba(212,175,55,0.6); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>
</head>
<body>

<div id="vanta-bg"></div>

<div id="page">

    <div id="hero">
        <div id="logo-wrap">
            <!-- Swap src to your cut-out PNG when ready -->
            <img src="logo.png" alt="SMART-ALECK"
                 onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
        </div>
        <div id="logo-text">SMART-ALECK</div>
        <div class="hero-sub">ENTERPRISES — EST. 2003</div>
        <div id="player-bar">
            <button id="play-btn" onclick="toggleMusic()">
                <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span id="play-label">PLAY</span>
            </button>
            <span class="track-label">Smart-Aleck_Solace.mp3</span>
        </div>
        <audio id="bg-music" loop>
            <source src="Smart-Aleck_Solace.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div id="main">

        <!-- FILTER BAR -->
        <div id="filters">
            <button class="filter-btn active" onclick="filter('all', this)">ALL</button>
            <button class="filter-btn" onclick="filter('live', this)">LIVE</button>
            <button class="filter-btn" onclick="filter('building', this)">BUILDING</button>
            <button class="filter-btn" onclick="filter('sale', this)">FOR SALE</button>
            <button class="filter-btn" onclick="filter('roadmap', this)">ROADMAP</button>
        </div>

        <div id="sections-container"></div>

    </div><!-- /main -->

    <div id="footer">
        SMART-ALECK ENTERPRISES LLC — EST. 2003 — ALL OPERATIONS BY <a href="https://fortressflash.com">FORTRESS FLASH LABS</a>
    </div>

</div><!-- /page -->

<script>
    VANTA.WAVES({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x4f0088,
        shininess: 138.00,
        waveHeight: 40.00,
        waveSpeed: 0.70,
        zoom: 0.65
    });

    function toggleMusic() {
        const audio = document.getElementById('bg-music');
        const icon = document.getElementById('play-icon');
        const label = document.getElementById('play-label');
        const pause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        const play = '<path d="M8 5v14l11-7z"/>';
        if (audio.paused) {
            audio.play();
            icon.innerHTML = pause;
            label.textContent = 'PAUSE';
        } else {
            audio.pause();
            icon.innerHTML = play;
            label.textContent = 'PLAY';
        }
    }

    const STATUS_MAP = {
        live:     { dot: 'dot-live',     cls: 'status-live',     label: 'LIVE' },
        building: { dot: 'dot-building', cls: 'status-building', label: 'BUILDING' },
        sale:     { dot: 'dot-sale',     cls: 'status-sale',     label: 'FOR SALE' },
        roadmap:  { dot: 'dot-roadmap',  cls: 'status-roadmap',  label: 'ROADMAP' },
    };

    function renderTile(tile) {
        const s  = STATUS_MAP[tile.status] || STATUS_MAP.roadmap;
        const el = document.createElement(tile.href ? 'a' : 'div');
        el.className    = 'tile';
        el.dataset.status = tile.status;
        if (tile.href) { el.href = tile.href; el.target = '_blank'; el.rel = 'noopener'; }

        el.insertAdjacentHTML('beforeend',
            `<div class="tile-img-wrap"><img src="images/tiles/${tile.image || ''}" alt="" loading="lazy" onerror="this.style.display='none'"></div>` +
            `<div class="tile-cat">${tile.cat}</div>`
        );

        const nameDiv = document.createElement('div');
        nameDiv.className = 'tile-name';
        if (tile.domain) {
            const fav = document.createElement('img');
            fav.className = 'tile-favicon';
            fav.src       = 'https://www.google.com/s2/favicons?domain=' + tile.domain.split('·')[0].trim() + '&sz=64';
            fav.alt       = '';
            fav.loading   = 'lazy';
            nameDiv.appendChild(fav);
        }
        nameDiv.appendChild(document.createTextNode(tile.name));
        el.appendChild(nameDiv);

        el.insertAdjacentHTML('beforeend',
            `<div class="tile-desc">${tile.desc}</div>` +
            `<div class="tile-footer">` +
              `<div class="status"><div class="dot ${s.dot}"></div><span class="${s.cls}">${s.label}</span></div>` +
              `<div class="tile-domain">${tile.domain}</div>` +
            `</div>`
        );
        return el;
    }

    async function loadTiles() {
        const { sections, tiles } = await fetch('tiles.json').then(r => r.json());
        const container = document.getElementById('sections-container');
        sections.forEach(sec => {
            const secTiles = tiles.filter(t => t.section === sec.id);
            if (!secTiles.length) return;
            const secEl = document.createElement('div');
            secEl.className = 'section';
            secEl.innerHTML = `<div class="section-header">${sec.title}</div><div class="tile-grid"></div>`;
            const grid = secEl.querySelector('.tile-grid');
            secTiles.forEach(t => grid.appendChild(renderTile(t)));
            container.appendChild(secEl);
        });
    }

    loadTiles();

    function filter(status, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tile').forEach(tile => {
            if (status === 'all' || tile.dataset.status === status) {
                tile.removeAttribute('data-hidden');
            } else {
                tile.setAttribute('data-hidden', 'true');
            }
        });
    }
</script>

</body>
</html>
