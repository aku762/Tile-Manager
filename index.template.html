</head>
<body>

<div id="vanta-bg"></div>

<div id="page">

    <div id="hero">
        <div id="logo-wrap">
            <img src="logo.png" alt="SMART-ALECK"
                 onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
        </div>
        <div id="logo-text">SMART-ALECK</div>
        <div class="hero-sub">ENTERPRISES — EST. 2003</div>
        <!--div id="player-bar">
            <button id="play-btn" onclick="toggleMusic()">
                <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span id="play-label">PLAY</span>
            </button>
            <span class="track-label">Smart-Aleck_Solace.mp3</span>
        </div>
        <audio id="bg-music" loop>
            <source src="Smart-Aleck_Solace.mp3" type="audio/mpeg">
        </audio-->
    </div>

    <div id="main">

        <!-- FILTER BAR -->
        <div id="filters">
            <button class="filter-btn active" onclick="filter('all', this)">ALL</button>
            <button class="filter-btn" onclick="filter('live', this)">LIVE</button>
            <button class="filter-btn" onclick="filter('building', this)">BUILDING</button>
            <button class="filter-btn" onclick="filter('sale', this)">FOR SALE</button>
            <button class="filter-btn" onclick="filter('roadmap', this)">ROADMAP</button>
        </div>

        <div id="sections-container"><!--SECTIONS--></div>

    </div><!-- /main -->

    <div id="footer">
        SMART-ALECK ENTERPRISES LLC — EST. 2003 — ALL OPERATIONS BY <a href="https://fortressflash.com">FORTRESS FLASH LABS</a>
    </div>

</div><!-- /page -->

<script>
    VANTA.WAVES({
        el: "#vanta-bg",
        mouseControls: true, touchControls: true, gyroControls: false,
        minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00,
        color: 0x4f0088, shininess: 138.00, waveHeight: 40.00, waveSpeed: 0.70, zoom: 0.65
    });

    function toggleMusic() {
        const audio = document.getElementById('bg-music');
        const icon  = document.getElementById('play-icon');
        const label = document.getElementById('play-label');
        const pause = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        const play  = '<path d="M8 5v14l11-7z"/>';
        if (audio.paused) { audio.play();  icon.innerHTML = pause; label.textContent = 'PAUSE'; }
        else              { audio.pause(); icon.innerHTML = play;  label.textContent = 'PLAY';  }
    }

    function filter(status, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tile').forEach(tile => {
            if (status === 'all' || tile.dataset.status === status) tile.removeAttribute('data-hidden');
            else tile.setAttribute('data-hidden', 'true');
        });
    }
</script>
