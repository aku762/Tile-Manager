<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{SITE_TITLE}}">
    <meta property="og:description" content="{{SITE_DESCRIPTION}}">
    <meta property="og:image" content="{{SITE_OG}}">
    <meta property="og:url" content="{{SITE_URL}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{SITE_TITLE}}">
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}">
    <meta name="twitter:image" content="{{SITE_OG}}">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="page">

    <div id="hero">
        <div id="logo-wrap">
            <img src="{{SITE_LOGO}}" alt="{{SITE_TITLE}}"
                 onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
        </div>
        <div id="logo-text">{{SITE_TITLE}}</div>
        <div class="hero-sub">{{SITE_TAGLINE}}</div>
    </div>

    <div id="main">

        <!-- FILTER BAR -->
        <div id="filters">
            <button class="filter-btn active" onclick="filter('all', this)">ALL</button>
            <button class="filter-btn" onclick="filter('live', this)">LIVE</button>
            <button class="filter-btn" onclick="filter('building', this)">BUILDING</button>
            <button class="filter-btn" onclick="filter('sale', this)">FOR SALE</button>
            <button class="filter-btn" onclick="filter('roadmap', this)">ROADMAP</button>
        </div>

        <div id="sections-container"><!--SECTIONS--></div>

    </div><!-- /main -->

    <div id="footer">
        {{SITE_FOOTER}}
    </div>

</div><!-- /page -->

<script>
    function filter(status, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tile').forEach(tile => {
            if (status === 'all' || tile.dataset.status === status) tile.removeAttribute('data-hidden');
            else tile.setAttribute('data-hidden', 'true');
        });
    }
</script>

<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"a2ef3b10cd3d4d1c86e7c55fd3605a54","r":1,"server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>

</body>
</html>
