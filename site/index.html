<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{SITE_TITLE}}">
    <meta property="og:description" content="{{SITE_DESCRIPTION}}">
    <meta property="og:image" content="{{SITE_OG}}">
    <meta property="og:url" content="{{SITE_URL}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{SITE_TITLE}}">
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}">
    <meta name="twitter:image" content="{{SITE_OG}}">
    <link rel="icon" href="{{SITE_ICON}}">
    <link rel="apple-touch-icon" href="{{SITE_ICON}}">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="{{SITE_THEME_COLOR}}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="{{SITE_SHORT_NAME}}">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
    {{SITE_SCHEMA}}
</head>
<body>

<div id="page">

    <div id="hero">
        <div id="logo-wrap">
            <img src="{{SITE_LOGO}}" alt="{{SITE_TITLE}}"
                 onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
        </div>
        <div id="logo-text">{{SITE_TITLE}}</div>
        <div class="hero-sub">{{SITE_TAGLINE}}</div>
    </div>

    <div id="main">

        <!-- FILTER BAR -->
        <div id="filters">
            <button class="filter-btn active" onclick="filter('all', this)">ALL</button>
            <!--FILTERS-->
        </div>

        <!--FEATURED-->
        <!--SECTIONS-->

    </div><!-- /main -->

    <div id="footer">
        {{SITE_FOOTER}}
    </div>

</div><!-- /page -->

<div id="player-bar">
    <img id="player-img" src="" alt="">
    <div id="player-info">
        <div id="player-track"></div>
        <div id="player-artist"></div>
    </div>
    <button id="player-btn" onclick="playerToggle()">▶</button>
    <div id="player-progress" onclick="playerSeek(event,this)">
        <div id="player-prog"></div>
    </div>
    <span id="player-time">0:00</span>
</div>

<script>window._siteRoot = '';</script>
<script src="player.js"></script>


<!-- local-preview: stripped at build time -->
<script src="../core/app.js"></script>

</body>
</html>
