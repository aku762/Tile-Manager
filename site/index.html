<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{SITE_TITLE}}">
    <meta property="og:description" content="{{SITE_DESCRIPTION}}">
    <meta property="og:image" content="{{SITE_OG}}">
    <meta property="og:url" content="{{SITE_URL}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{SITE_TITLE}}">
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}">
    <meta name="twitter:image" content="{{SITE_OG}}">
    <link rel="icon" href="{{SITE_ICON}}">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="page">

    <div id="hero">
        <div id="logo-wrap">
            <img src="{{SITE_LOGO}}" alt="{{SITE_TITLE}}"
                 onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
        </div>
        <div id="logo-text">{{SITE_TITLE}}</div>
        <div class="hero-sub">{{SITE_TAGLINE}}</div>
    </div>

    <div id="main">

        <!-- FILTER BAR -->
        <div id="filters">
            <button class="filter-btn active" onclick="filter('all', this)">ALL</button>
            <!--FILTERS-->
        </div>

        <!--FEATURED-->
        <!--SECTIONS-->

    </div><!-- /main -->

    <div id="footer">
        {{SITE_FOOTER}}
    </div>

</div><!-- /page -->

<script>
    function filter(status, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.tile').forEach(tile => {
            if (status === 'all' || tile.dataset.status === status) tile.removeAttribute('data-hidden');
            else tile.setAttribute('data-hidden', 'true');
        });
    }

    let _aud = null, _audBtn = null, _audWrap = null, _sessionReady = false;

    function _fmtTime(s) {
        s = Math.floor(s || 0);
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    // Deduplicate by data-src (featured tiles appear in both <!--FEATURED--> and <!--SECTIONS-->)
    // dir: +1 = next, -1 = previous
    function _audioGetAdjacent(dir) {
        if (!_audWrap) return null;
        const seen = new Set();
        const unique = Array.from(document.querySelectorAll('.tile-audio')).filter(el => {
            if (seen.has(el.dataset.src)) return false;
            seen.add(el.dataset.src); return true;
        });
        const idx = unique.findIndex(el => el.dataset.src === _audWrap.dataset.src);
        return unique[idx + dir] || null;
    }

    function audioPlay(btn) {
        const wrap = btn.closest('.tile-audio');
        const src  = wrap.dataset.src;
        if (_audBtn && _audBtn !== btn) {
            _aud.pause();
            _audBtn.textContent = '▶';
        }
        if (!_aud || _audWrap !== wrap) {
            if (_aud) _aud.pause();
            _aud          = new Audio(src);
            _aud.preload  = 'metadata';
            _audWrap = wrap;
            _aud.ontimeupdate = function() {
                const pct = (_aud.currentTime / _aud.duration * 100) || 0;
                wrap.querySelector('.audio-prog').style.width = pct + '%';
                wrap.querySelector('.audio-time').textContent = _fmtTime(_aud.currentTime) + ' / ' + _fmtTime(_aud.duration);
            };
            _aud.onended = function() {
                btn.textContent = '▶';
                wrap.querySelector('.audio-prog').style.width = '0%';
                wrap.querySelector('.audio-time').textContent = '0:00';
                const next = _audioGetAdjacent(1);
                if (next) {
                    audioPlay(next.querySelector('.audio-btn'));
                } else {
                    _aud = null; _audBtn = null; _audWrap = null;
                }
            };
            if ('mediaSession' in navigator) {
                const img = wrap.dataset.image;
                const artwork = img ? [
                    { src: new URL('images/wide/' + img, location.href).href, sizes: '1200x630' }
                ] : [];
                navigator.mediaSession.metadata = new MediaMetadata({
                    title:   wrap.dataset.track  || wrap.dataset.name || '',
                    artist:  wrap.dataset.artist || '',
                    album:   wrap.dataset.album  || '',
                    artwork
                });
                if (!_sessionReady) {
                    _sessionReady = true;
                    navigator.mediaSession.setActionHandler('play',  () => { if (_aud) { _aud.play();  if (_audBtn) _audBtn.textContent = '⏸'; }});
                    navigator.mediaSession.setActionHandler('pause', () => { if (_aud) { _aud.pause(); if (_audBtn) _audBtn.textContent = '▶'; }});
                    navigator.mediaSession.setActionHandler('nexttrack',     () => { const n = _audioGetAdjacent(1);  if (n) audioPlay(n.querySelector('.audio-btn')); });
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        const p = _audioGetAdjacent(-1);
                        if (p) audioPlay(p.querySelector('.audio-btn'));
                        else if (_aud) _aud.currentTime = 0;
                    });
                }
            }
        }
        if (_aud.paused) {
            _aud.play(); btn.textContent = '⏸';
            if (wrap.dataset.slug) history.replaceState(null, '', '#' + wrap.dataset.slug);
        } else {
            _aud.pause(); btn.textContent = '▶';
        }
        _audBtn = btn;
    }

    function initHashRouting() {
        const slug = location.hash.slice(1);
        if (!slug) return;
        const target = document.querySelector('.tile-audio[data-slug="' + CSS.escape(slug) + '"]');
        if (!target) return;
        const tile = target.closest('.tile');
        if (tile) tile.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => audioPlay(target.querySelector('.audio-btn')), 400);
    }
    initHashRouting();

    function audioSeek(e, bar) {
        if (!_aud || !_aud.duration) return;
        const rect = bar.getBoundingClientRect();
        _aud.currentTime = ((e.clientX - rect.left) / rect.width) * _aud.duration;
    }

    function audioMute(btn) {
        if (!_aud) return;
        _aud.muted = !_aud.muted;
        btn.textContent = _aud.muted ? '🔇' : '🔊';
    }

    function audioImgPlay(e, wrap) {
        if (e.target.closest('.tile-audio')) return;
        e.preventDefault();
        e.stopPropagation();
        const btn = wrap.querySelector('.audio-btn');
        if (btn) audioPlay(btn);
    }
</script>

<!-- local-preview: stripped at build time -->
<script src="../core/app.js"></script>

</body>
</html>
