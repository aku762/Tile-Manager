<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{INFO_TITLE}} — {{SITE_TITLE}}</title>
    <meta name="description" content="{{INFO_DESC}}">
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{INFO_TITLE}}">
    <meta property="og:description" content="{{INFO_DESC}}">
    {{INFO_SCHEMA}}
    <link rel="icon" href="{{ROOT}}{{SITE_ICON}}">
    <link rel="apple-touch-icon" href="{{ROOT}}{{SITE_ICON}}">
    <link rel="manifest" href="{{ROOT}}manifest.json">
    <link rel="stylesheet" href="{{ROOT}}style.css">
</head>
<body>

<div id="page">

    <div id="main">

        <div class="track-back-bar">
            <a href="/" class="track-back">← {{SITE_TITLE}}</a>
        </div>

        <!--INFO_HERO-->

        <div class="track-main">

            <div class="track-details">
                <div class="track-cat">{{INFO_CAT}}</div>
                <div class="track-title">{{INFO_TITLE}}</div>
                <div class="track-desc">{{INFO_DESC}}</div>
            </div>

            {{INFO_CONTENT}}

        </div>

    </div><!-- /main -->

    <div id="footer">{{SITE_FOOTER}}</div>

</div>

<script>window._siteRoot = '{{ROOT}}';</script>
<script src="{{ROOT}}player.js"></script>

</body>
</html>
